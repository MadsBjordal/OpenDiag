name: Release

# Builds the Windows installer and the Android app and attaches them to a
# GitHub Release. Run it from the Actions tab ("Run workflow") or push a tag
# such as v0.2.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

# The release this build becomes; the app compares it with GitHub's newest to offer updates.
env:
  OPENDIAG_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || format('test-build-{0}', github.run_number) }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Android NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Signed with the project's own key (GitHub secrets, see docs/building.md), so
      # each build installs as an update over the previous one.
      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The Android signing key is missing. Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (docs/building.md, 'Android signing key')."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/opendiag.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/opendiag.jks"
          export OPENDIAG_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          pnpm tauri android build --apk --target aarch64
          cp apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk OpenDiag-android-arm64.apk
          rm -f "$ANDROID_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: OpenDiag-android-arm64.apk

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    env:
      TITLE: ${{ github.ref_type == 'tag' && github.ref_name || format('Test build {0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      # Release notes = the "Unreleased" part of CHANGELOG.md (what the app shows as "What's new").
      - name: Release notes from the changelog
        run: |
          python3 scripts/changelog.py notes > notes.md
          cat >> notes.md <<'EOF2'

          ---
          Pre-release test build of OpenDiag. Functions marked "not hardware-verified" have only been tested against the simulator.
          Windows: run the setup .exe (Windows may warn because it is not signed yet: More info → Run anyway).
          Android: open the .apk on an arm64 phone and allow installing from this source. Installed builds offer the next update themselves.
          Full history: CHANGELOG.md
          EOF2
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.OPENDIAG_RELEASE }}
          name: ${{ env.TITLE }}
          prerelease: true
          body_path: notes.md
          files: out/*
      # The released section gets the build's name; a new, empty "Unreleased" starts.
      - name: Date the changelog section
        if: github.ref_type == 'branch'
        run: |
          python3 scripts/changelog.py release "$TITLE" "$(date -u +%Y-%m-%d)"
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Changelog: $TITLE released" CHANGELOG.md
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
