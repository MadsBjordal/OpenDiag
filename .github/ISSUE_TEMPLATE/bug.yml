name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce (simulator profile if it happens there too) }
  - type: input
    id: env
    attributes: { label: OS, OpenDiag version, adapter }
  - type: textarea
    id: log
    attributes: { label: "Adapter log or error text (VIN hidden)" }
