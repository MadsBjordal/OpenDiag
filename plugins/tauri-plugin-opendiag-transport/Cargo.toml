[package]
name = "tauri-plugin-opendiag-transport"
description = "Android USB host and Bluetooth Classic links for OpenDiag (no-op on desktop)."
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
links = "tauri-plugin-opendiag-transport"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
opendiag-core = { path = "../../crates/opendiag-core" }
opendiag-api = { path = "../../crates/opendiag-api", default-features = false }
opendiag-transport = { path = "../../crates/opendiag-transport", default-features = false }
